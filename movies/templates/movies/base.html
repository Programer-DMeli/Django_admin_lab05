<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cine{% endblock %}</title>
  <style>
    :root { --bg:#0f1115; --card:#181b22; --line:#272b35; --fg:#e8eaf0; --muted:#98a0b3; --accent:#4f8cff; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           background:var(--bg); color:var(--fg); line-height:1.5; }
    header { border-bottom:1px solid var(--line); background:var(--card); }
    .wrap { max-width:1080px; margin:0 auto; padding:0 20px; }
    nav { display:flex; gap:22px; align-items:center; height:60px; }
    nav a { color:var(--muted); text-decoration:none; font-weight:500; }
    nav a:hover, nav a.active { color:var(--fg); }
    .brand { font-weight:700; color:var(--fg) !important; margin-right:auto; }
    main { padding:32px 0 64px; }
    h1 { font-size:28px; margin:0 0 6px; }
    .lead { color:var(--muted); margin:0 0 28px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    .card .body { padding:14px; }
    .card h3 { margin:0 0 6px; font-size:16px; }
    .card h3 a { color:var(--fg); text-decoration:none; }
    .card h3 a:hover { color:var(--accent); }
    .meta { color:var(--muted); font-size:13px; }
    .badge { display:inline-block; background:#222735; color:var(--muted);
             border:1px solid var(--line); border-radius:999px;
             padding:2px 9px; font-size:12px; margin:0 5px 5px 0; }
    .score { color:#ffc857; font-weight:600; }
    .poster { aspect-ratio:2/3; background:#222735; display:flex; align-items:center;
              justify-content:center; color:var(--muted); font-size:13px; }
    .poster img { width:100%; height:100%; object-fit:cover; }
    form.filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:26px; }
    input, select, button { background:#13161d; color:var(--fg); border:1px solid var(--line);
        border-radius:8px; padding:9px 12px; font-size:14px; font-family:inherit; }
    button { background:var(--accent); border-color:var(--accent); color:#fff; cursor:pointer; font-weight:600; }
    a.tag { color:var(--muted); text-decoration:none; }
    a.tag:hover { color:var(--accent); }
    table { width:100%; border-collapse:collapse; background:var(--card);
            border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    th, td { padding:11px 14px; text-align:left; border-bottom:1px solid var(--line); font-size:14px; }
    th { color:var(--muted); font-weight:600; }
    tr:last-child td { border-bottom:none; }
    section.block { margin-bottom:40px; }
    h2 { font-size:19px; margin:0 0 14px; }
    .empty { color:var(--muted); background:var(--card); border:1px dashed var(--line);
             border-radius:10px; padding:28px; text-align:center; }
    .note { border-left:3px solid var(--accent); background:#141a2a;
            padding:12px 16px; border-radius:0 8px 8px 0; margin-bottom:24px; font-size:14px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <nav>
        <a class="brand" href="{% url 'movies:movie_list' %}">Cine</a>
        <a href="{% url 'movies:movie_list' %}">Catálogo</a>
        <a href="{% url 'movies:recommendations' %}">Recomendaciones</a>
        <a href="/admin/">Administración</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
